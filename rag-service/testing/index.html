<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Museum AI Testing</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{

    background:#f2f2f2;

    display:flex;

    justify-content:center;

    align-items:center;

    height:100vh;

}

.chat-container{

    width:700px;

    height:90vh;

    background:white;

    border-radius:10px;

    box-shadow:0 0 15px rgba(0,0,0,.15);

    display:flex;

    flex-direction:column;

}

.header{

    background:#0f62fe;

    color:white;

    padding:15px;

    text-align:center;

    font-size:22px;

    font-weight:bold;

}

.chat-box{

    flex:1;

    overflow-y:auto;

    padding:20px;

    background:#fafafa;

}

.message{

    margin-bottom:15px;

    display:flex;

}

.user{

    justify-content:flex-end;

}

.ai{

    justify-content:flex-start;

}

.bubble{

    max-width:75%;

    padding:12px 15px;

    border-radius:12px;

    white-space:pre-wrap;

    line-height:1.5;

}

.user .bubble{

    background:#0f62fe;

    color:white;

}

.ai .bubble{

    background:#e9ecef;

    color:black;

}

.input-area{

    display:flex;

    border-top:1px solid #ddd;

}

#question{

    flex:1;

    padding:15px;

    border:none;

    outline:none;

    font-size:16px;

}

button{

    width:120px;

    border:none;

    background:#0f62fe;

    color:white;

    cursor:pointer;

    font-size:16px;

}

button:hover{

    background:#0043ce;

}

.loading{

    font-style:italic;

    color:#666;

}

</style>

</head>

<body>

<div class="chat-container">

<div class="header">

Museum AI Assistant (Testing)

</div>

<div class="chat-box" id="chatBox">

<div class="message ai">

<div class="bubble">

Halo 👋

Saya adalah Museum AI Assistant.

Silakan tanyakan apa saja mengenai koleksi Museum Sri Baduga.

</div>

</div>

</div>

<div class="input-area">

<input

id="question"

type="text"

placeholder="Ketik pertanyaan..."

>

<button onclick="sendMessage()">

Kirim

</button>

</div>

</div>

<script>

const chatBox=document.getElementById("chatBox");

const input=document.getElementById("question");

function addMessage(text,type){

    const message=document.createElement("div");

    message.className="message "+type;

    const bubble=document.createElement("div");

    bubble.className="bubble";

    bubble.innerText=text;

    message.appendChild(bubble);

    chatBox.appendChild(message);

    chatBox.scrollTop=chatBox.scrollHeight;

}

async function sendMessage(){

    const question=input.value.trim();

    if(question==="") return;

    addMessage(question,"user");

    input.value="";

    const loading=document.createElement("div");

    loading.className="message ai";

    loading.id="loading";

    loading.innerHTML='<div class="bubble loading">Museum AI sedang berpikir...</div>';

    chatBox.appendChild(loading);

    chatBox.scrollTop=chatBox.scrollHeight;

    try{

        const response=await fetch("http://127.0.0.1:8000/chat",{

            method:"POST",

            headers:{

                "Content-Type":"application/json"

            },

            body:JSON.stringify({

                question:question,

                session_id:"testing"

            })

        });

        document.getElementById("loading").remove();

        if(!response.ok){

            addMessage("Backend Error : "+response.status,"ai");

            return;

        }

        const data=await response.json();

        addMessage(data.answer,"ai");

    }

    catch(error){

        document.getElementById("loading").remove();

        addMessage("Tidak dapat terhubung ke Backend.","ai");

        console.log(error);

    }

}

input.addEventListener("keypress",function(e){

    if(e.key==="Enter"){

        sendMessage();

    }

});

</script>

</body>
</html>
